<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>To-Do List</h1>

      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Add a new task..." aria-label="New task" required />
        <button type="submit">Add</button>
      </form>

      <p id="task-count" aria-live="polite"></p>
      <div class="filters" id="filters"><button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All</button><button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button><button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button></div>
      <button type="button" id="toggle-all" hidden>Mark all complete</button>
      <button type="button" id="clear-completed" hidden>Clear completed</button>
      <ul id="todo-list"></ul>
      <p id="empty-message">No tasks yet. Add one above.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
