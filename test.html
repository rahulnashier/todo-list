<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8" />
  <title>Unit tests</title>
  </head>
  <body>
  <h1>Unit tests</h1>
  <pre id="results">Running...</pre>
  <script src="utils.js"></script>
  <script>
  const results = [];

function assertEqual(actual, expected, label) {
  const pass = actual === expected;
results.push((pass ? "PASS" : "FAIL") + " - " + label);
}

assertEqual(pluralize(1, "task left", "tasks left"), "task left", "pluralize(1) returns singular");
assertEqual(pluralize(0, "task left", "tasks left"), "tasks left", "pluralize(0) returns plural");
assertEqual(pluralize(5, "task left", "tasks left"), "tasks left", "pluralize(5) returns plural");

document.getElementById("results").textContent = results.join("\n");
</script>
  </body>
  </html>
